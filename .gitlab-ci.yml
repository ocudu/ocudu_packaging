spec:
  inputs:
    ocudu_path:
      type: string
      default: ocudu/ocudu
      description: "OCUDU repository path."
    ocudu_ref:
      type: string
      default: dev
      description: "OCUDU reference branch or tag."
---
include:
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/workflow.yml
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/static.yml
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/docker.yml
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/gitlab_settings/.gitlab-ci.yml
    inputs:
      ocudu_path: $[[ inputs.ocudu_path ]]
      ocudu_ref: $[[ inputs.ocudu_ref ]]
  - local: .gitlab/ci-shared/versions.yml

variables:
  OCUDU_REGISTRY_URI: ${CI_TEMPLATE_REGISTRY_HOST}/$[[ inputs.ocudu_path ]]

stages:
  - ci
  - static
  - test
  - build
  - publish
  - release

headers:
  stage: ci
  extends: .headers

pkg_docker_version_changed:
  stage: static
  rules:
    - if: $ON_MR
      changes:
        paths:
          - debian_packaging/packaging_docker/**/*
  image: alpine:3.16.0 # sh entrypoint
  before_script:
    - apk add git
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME --depth 20
  script:
    - NEW_VERSION=$(cat .gitlab/ci-shared/versions.yml | grep UBUNTU_PACKAGING_VERSION | cut -d'"' -f2)
    - git checkout $CI_MERGE_REQUEST_DIFF_BASE_SHA
    - OLD_VERSION=$(cat .gitlab/ci-shared/versions.yml | grep UBUNTU_PACKAGING_VERSION | cut -d'"' -f2) || exit 0
    - |
      echo "OLD version: $OLD_VERSION -- NEW version: $NEW_VERSION"
    - |
      [ "$OLD_VERSION" = "$NEW_VERSION" ] && exit 1 || exit 0

.pkg-docker:
  extends: .docker-builder
  before_script:
    - |
      export NAME=ubuntu_${OS_VERSION}_img_pkg
      export CONTEXT=debian_packaging/packaging_docker
      export BUILD_ARGS="distro_version=$OS_VERSION"
      export VERSION=$UBUNTU_PACKAGING_VERSION
  parallel:
    matrix:
      - OS_VERSION: "22.04"
      - OS_VERSION: "24.04"
      - OS_VERSION: "25.04"
      # - OS_VERSION: "25.10"             # disabled, see comment below
      - OS_VERSION: "questing-20250830"   # temporary alternative for 25.10, see comment below
      # Since version 20251007 of Ubuntu 25.10 a Rust implemntation of coreutils (rust-coreutils and coreutils-from-uutils)
      # is used instead of the traditional version from GNU (coreutils-from-gnu). A bug in the Rust coreutils
      # causes a permission error during startup of the container (as the packing is run as unprivileged user).

build docker:
  stage: static
  extends: .pkg-docker
  rules:
    - if: $ON_MR
      changes: &docker_changes
        paths: 
          - debian_packaging/packaging_docker/**/*
          - .gitlab/ci-shared/versions.yml
          - .gitlab-ci.yml
  variables:
    MODE: build

publish docker:
  stage: publish
  extends: .pkg-docker
  rules:
    - if: $ON_DEFAULT_BRANCH
      changes:
        <<: *docker_changes
        compare_to: refs/tags/latest
    - if: $ON_MR
      changes:
        <<: *docker_changes
      when: manual
      allow_failure: true
  variables:
    MODE: publish
